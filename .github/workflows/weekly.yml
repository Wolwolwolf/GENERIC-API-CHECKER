name: Weekly data refresh

on:
  schedule:
    # 每周一 09:17 北京时间 = 01:17 UTC
    - cron: "17 1 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update database from official sources
        run: python main.py update --days 35

      - name: Rebuild static query page
        run: python build_widget.py .

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/generics.db index.html
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: weekly data refresh $(date -u +%Y-%m-%d)"
            git push
          fi
