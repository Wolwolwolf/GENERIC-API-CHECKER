<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>仿制药全球许可查询 · Generic API Checker</title>
<style>
  :root { --daimon-widget-host-safe-inline-end: 190px; --daimon-widget-host-safe-block-start: 44px; }
  .kimi-host-safe-context { container-type: inline-size; }
  .kimi-host-safe-header {
    box-sizing: border-box;
    min-block-size: var(--daimon-widget-host-safe-block-start, 44px);
    padding-inline-end: var(--daimon-widget-host-safe-inline-end, 190px);
  }
  @container (max-width: 419px) {
    .kimi-host-safe-header { min-block-size: 0; padding-block-start: var(--daimon-widget-host-safe-block-start, 44px); padding-inline-end: 0; }
  }
  [data-kimi-root] { box-sizing: border-box; inline-size: 100%; min-inline-size: 0; max-inline-size: 100%; overflow: visible; }
  [data-kimi-root] * { box-sizing: border-box; min-inline-size: 0; }
  html[data-daimon-size-tier="compact"] [data-kimi-priority="p1"],
  html[data-daimon-size-tier="compact"] [data-kimi-priority="p2"],
  html[data-daimon-size-tier="compact"] [data-kimi-priority="p3"] { display: none !important; }

  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--kimi-font-sans, system-ui, -apple-system, "Segoe UI", sans-serif);
    color: var(--kimi-color-text-primary);
    font-size: 14px; line-height: 1.6; letter-spacing: 0;
  }
  main { padding: 4px 2px 16px; max-width: 980px; margin-inline: auto; }
  code, .mono { font-family: var(--kimi-font-mono, ui-monospace, monospace); }

  /* ---------- Hero ---------- */
  .hero { padding: 6px 2px 0; }
  .hero h1 {
    font-size: 22px; font-weight: 700; margin: 0; letter-spacing: .2px;
    background: linear-gradient(92deg, var(--kimi-color-accent, #2f6fed), #7c5cff 70%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .hero .sub { margin: 4px 0 0; font-size: 12.5px; color: var(--kimi-color-text-tertiary); }
  .stats { display: flex; flex-wrap: wrap; gap: 8px; margin-block-start: 10px; }
  .stat {
    display: inline-flex; align-items: baseline; gap: 6px;
    padding: 5px 12px; border-radius: 999px; font-size: 12px;
    border: 1px solid var(--kimi-color-border);
    background: var(--kimi-color-surface-raised);
    color: var(--kimi-color-text-secondary);
  }
  .stat b { font-size: 14px; font-weight: 700; color: var(--kimi-color-text-primary); }

  /* ---------- 查询舞台 ---------- */
  .stage { position: relative; isolation: isolate; margin-block-start: 12px; }
  #pix { position: absolute; inset: 0; z-index: 0; overflow: hidden; border-radius: 14px;
         color: var(--kimi-color-text-tertiary); pointer-events: none; }
  .panel {
    position: relative; z-index: 1;
    border: 1px solid var(--kimi-color-border); border-radius: 14px;
    background: var(--kimi-color-surface-raised); color: var(--kimi-color-text-primary);
    padding: 16px; margin: 12px;
  }
  @supports ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
    .panel {
      border-color: var(--kimi-glass-border); background: var(--kimi-glass-surface);
      box-shadow: 0 12px 40px var(--kimi-glass-shadow), inset 0 1px 0 var(--kimi-glass-highlight), inset 0 -1px 0 var(--kimi-glass-lowlight);
      backdrop-filter: blur(var(--kimi-glass-blur)); -webkit-backdrop-filter: blur(var(--kimi-glass-blur));
    }
  }
  .tabs { display: flex; gap: 6px; margin-block-end: 10px; }
  .tab {
    font: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer;
    padding: 5px 16px; border-radius: 999px;
    border: 1.5px solid var(--kimi-color-border, #d0d7de);
    background: transparent; color: var(--kimi-color-text-secondary, #57606a);
    transition: all 140ms ease;
  }
  .tab:hover { border-color: var(--kimi-color-accent, #2f6fed); color: var(--kimi-color-accent, #2f6fed); }
  .tab.active {
    background: linear-gradient(135deg, var(--kimi-color-accent, #2f6fed), #7c5cff);
    border-color: transparent; color: #fff;
  }
  .search-row {
    display: flex; gap: 10px; align-items: center;
    border: 2px solid var(--kimi-color-accent, #2f6fed);
    border-radius: 14px; padding: 6px 8px;
    background: var(--kimi-color-surface, #ffffff);
    box-shadow: 0 6px 20px rgba(47, 111, 237, 0.16);
    transition: box-shadow 160ms ease, border-color 160ms ease;
  }
  .search-row:focus-within {
    box-shadow: 0 8px 26px rgba(47, 111, 237, 0.28);
  }
  .search-box { position: relative; flex: 1; min-inline-size: 0; display: flex; align-items: center; }
  .search-box svg { position: absolute; inset-inline-start: 12px; opacity: .55; pointer-events: none; }
  .search-box input {
    width: 100%; font: inherit; letter-spacing: 0;
    padding: 9px 12px 9px 38px; border-radius: 10px;
    border: none; background: transparent; color: var(--kimi-color-text-primary, #24292f);
  }
  .search-box input:focus { outline: none; }
  .cta {
    font: inherit; font-weight: 600; cursor: pointer; padding: 10px 22px;
    border: none; border-radius: 12px; color: #fff;
    background: linear-gradient(135deg, var(--kimi-color-accent, #2f6fed), #7c5cff);
    box-shadow: 0 4px 14px color-mix(in srgb, var(--kimi-color-accent, #2f6fed) 35%, transparent);
    transition: transform 140ms ease, box-shadow 140ms ease, filter 140ms ease;
  }
  .cta:hover { filter: brightness(1.07); transform: translateY(-1px); }
  .cta:active { transform: translateY(0); }
  .examples { display: flex; flex-wrap: wrap; gap: 6px; margin-block-start: 10px; align-items: center; }
  .examples .lbl { font-size: 12px; color: var(--kimi-color-text-tertiary); }
  .chip {
    font: inherit; font-size: 12px; cursor: pointer; padding: 3px 11px; border-radius: 999px;
    border: 1px dashed var(--kimi-color-border); background: transparent;
    color: var(--kimi-color-text-secondary); transition: all 140ms ease;
  }
  .chip:hover { border-color: var(--kimi-color-accent); color: var(--kimi-color-accent); border-style: solid; }

  .p0-out { margin-block-start: 12px; }
  .p0-out output { display: block; font-size: 16px; font-weight: 700; line-height: 1.35; }
  .p0-out .meta { display: block; font-size: 12px; font-weight: 400; color: var(--kimi-color-text-secondary); margin-block-start: 3px; }
  .p0-out .empty { font-weight: 400; font-size: 13px; color: var(--kimi-color-text-tertiary); }

  /* ---------- 辖区导航 chips ---------- */
  .juris { display: flex; flex-wrap: wrap; gap: 8px; margin-block-start: 14px; }
  .jchip {
    display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
    padding: 5px 12px; border-radius: 999px; font-size: 12.5px;
    border: 1px solid var(--kimi-color-border); background: var(--kimi-color-surface-raised);
    color: var(--kimi-color-text-primary); transition: all 140ms ease;
  }
  .jchip:hover { border-color: var(--kimi-color-accent); transform: translateY(-1px); }
  .jchip .n {
    font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 999px;
    background: color-mix(in srgb, var(--kimi-color-accent, #2f6fed) 14%, transparent);
    color: var(--kimi-color-accent);
  }

  /* ---------- 结果卡片 ---------- */
  #results { margin-block-start: 8px; }
  .group {
    margin-block-start: 14px; border: 1px solid var(--kimi-color-border); border-radius: 14px;
    background: var(--kimi-color-surface-raised); overflow: hidden;
  }
  .group > header {
    display: flex; align-items: center; gap: 10px; padding: 12px 16px;
    border-inline-start: 4px solid var(--kimi-color-accent);
    background: color-mix(in srgb, var(--kimi-color-accent, #2f6fed) 5%, transparent);
  }
  .group > header .flag { font-size: 20px; }
  .group > header .tt { flex: 1; min-inline-size: 0; }
  .group > header .tt b { font-size: 14.5px; }
  .group > header .tt span { display: block; font-size: 11.5px; color: var(--kimi-color-text-tertiary); }
  .group > header .cnt {
    font-size: 11.5px; font-weight: 700; padding: 2px 10px; border-radius: 999px;
    background: var(--kimi-color-accent); color: var(--kimi-color-on-accent, #fff);
  }
  .rec {
    display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 2px 12px;
    padding: 10px 16px; border-block-start: 1px solid var(--kimi-color-border);
  }
  .rec:hover { background: color-mix(in srgb, var(--kimi-color-accent, #2f6fed) 4%, transparent); }
  .rec .pn { font-weight: 600; overflow-wrap: anywhere; }
  .rec .sub2 { grid-column: 1 / -1; font-size: 12px; color: var(--kimi-color-text-secondary); overflow-wrap: anywhere; }
  .rec a {
    color: var(--kimi-color-accent); text-decoration: none; font-size: 12.5px; white-space: nowrap;
    padding: 2px 10px; border-radius: 8px; border: 1px solid transparent; align-self: start;
  }
  .rec a:hover { border-color: var(--kimi-color-accent); }
  .rec.hidden-rec { display: none; }
  .expand-btn {
    display: block; width: 100%; font: inherit; font-size: 12.5px; cursor: pointer;
    padding: 9px; border: none; border-block-start: 1px solid var(--kimi-color-border);
    background: transparent; color: var(--kimi-color-accent); font-weight: 600;
  }
  .expand-btn:hover { background: color-mix(in srgb, var(--kimi-color-accent, #2f6fed) 6%, transparent); }

  /* ---------- 互认地图 ---------- */
  .card {
    margin-block-start: 18px; border: 1px solid var(--kimi-color-border); border-radius: 14px;
    background: var(--kimi-color-surface-raised); padding: 16px;
  }
  .card > h2 { font-size: 15px; font-weight: 700; margin: 0 0 4px; }
  .card > .desc { font-size: 12px; color: var(--kimi-color-text-tertiary); margin: 0 0 10px; }
  #map { inline-size: 100%; block-size: auto; display: block; }
  .legend { display: flex; flex-wrap: wrap; gap: 16px; font-size: 12px; color: var(--kimi-color-text-secondary); margin-block-start: 8px; }
  .legend i { display: inline-block; inline-size: 11px; block-size: 11px; border-radius: 4px; margin-inline-end: 6px; }
  .legend .lg-a i { background: var(--kimi-color-accent); }
  .legend .lg-u i { border: 2px dashed var(--kimi-color-accent); }

  .hints { display: grid; gap: 10px; }
  @container (min-width: 620px) { .hints { grid-template-columns: 1fr 1fr; } }
  .hint {
    border: 1px solid var(--kimi-color-border); border-radius: 12px; padding: 12px 14px;
    background: var(--kimi-color-surface);
  }
  .hint .h-t { font-weight: 700; font-size: 13px; color: var(--kimi-color-accent); }
  .hint .h-t .scope { font-weight: 400; color: var(--kimi-color-text-tertiary); font-size: 12px; }
  .hint .h-d { font-size: 12px; color: var(--kimi-color-text-secondary); margin-block-start: 3px; }
  .hint .h-u { font-size: 12.5px; margin-block-start: 4px; }
  .hint .h-u b { font-weight: 700; }

  footer {
    margin-block-start: 22px; padding-block-start: 12px; border-block-start: 1px solid var(--kimi-color-border);
    font-size: 11.5px; color: var(--kimi-color-text-tertiary); line-height: 1.7;
  }
  @media (prefers-reduced-motion: reduce) { .cta, .jchip, .chip { transition: none; } }
</style>
</head>
<body>
<main class="kimi-host-safe-context" data-kimi-root>
  <header class="kimi-host-safe-header hero">
    <h1>仿制药全球许可查询</h1>
    <p class="sub">Generic API Checker · 各国已获批同 API 药品目录 · 技术证明文件互认地图</p>
    <div class="stats" id="stats"></div>
  </header>

  <section class="stage" data-kimi-priority="p0" aria-label="API 查询">
    <div id="pix" aria-hidden="true"></div>
    <div class="panel kimi-glass kimi-glass-panel">
      <div class="tabs" role="tablist" aria-label="检索方式">
        <button class="tab active" data-mode="api" type="button" role="tab">按 API 检索</button>
        <button class="tab" data-mode="mfr" type="button" role="tab">按厂家检索</button>
      </div>
      <form id="f" class="search-row">
        <div class="search-box">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.8-3.8"/></svg>
          <input id="q" type="search" autocomplete="off" list="api-list"
                 placeholder="输入 API 中/英文名，如：阿托伐他汀 / atorvastatin"
                 aria-label="仿制药 API 名称（中文或英文）">
          <datalist id="api-list"></datalist>
          <datalist id="mfr-list"></datalist>
        </div>
        <button class="cta" type="submit">查询</button>
      </form>
      <div class="examples" id="examples">
        <span class="lbl">试试：</span>
      </div>
      <div class="p0-out">
        <output id="headline" aria-live="polite"></output>
        <span id="headmeta" class="meta"></span>
      </div>
    </div>
  </section>

  <nav class="juris" id="juris" hidden aria-label="获批辖区导航"></nav>

  <section id="results" hidden>
    <div id="groups" data-kimi-priority="p1"></div>
    <div class="card" data-kimi-priority="p2">
      <h2>🌐 互认地图：相同技术证明文件可用范围</h2>
      <p class="desc">实色 = 该 API 已获批；虚线框 = 可凭相同技术证明文件（CTD/DMF/CEP 等）使用的辖区；箭头 = 互认/信赖机制</p>
      <svg id="map" viewBox="0 0 720 300" role="img" aria-label="技术证明文件互认示意图"></svg>
      <div class="legend">
        <span class="lg-a"><i></i>已获批该 API</span>
        <span class="lg-u"><i></i>可凭相同技术文件使用</span>
      </div>
    </div>
    <div class="card" data-kimi-priority="p2">
      <h2>📋 机制提示</h2>
      <p class="desc">除「疗效结论互认（制度化）」外，其余机制不替代目标国注册程序</p>
      <div id="hints" class="hints"></div>
    </div>
  </section>

  <footer data-kimi-priority="p3" id="foot"></footer>
</main>

<script>
const DATA = __WIDGET_DATA__;
</script>
<script>
(function () {
  'use strict';
  /* ---------- 别名解析 ---------- */
  const zh2en = {}, var2en = {};
  for (const [en, info] of Object.entries(DATA.aliases)) {
    zh2en[info.zh] = en;
    (info.variants || []).forEach(v => { var2en[v.toLowerCase()] = en; });
  }
  function normalize(t) {
    const s = t.trim();
    const low = s.toLowerCase();
    if (zh2en[s]) return { en: zh2en[s], zh: s };
    if (DATA.aliases[low]) return { en: low, zh: DATA.aliases[low].zh };
    if (var2en[low]) { const en = var2en[low]; return { en, zh: DATA.aliases[en].zh }; }
    // 中文输入：去剂型后缀后既匹配中文名，也尝试别名包含匹配
    return { en: /[\u4e00-\u9fff]/.test(s) ? null : low, zh: /[\u4e00-\u9fff]/.test(s) ? s : null };
  }

  /* ---------- 检索 ---------- */
  function search(q) {
    const { en, zh } = normalize(q);
    if (!en && !zh) return { term: en, zh, rows: [] };
    let zhTerms = zh ? [zh] : [];
    if (zh) {  // 中文输入额外展开：别名库中包含该词的中文也一并查
      for (const [z, e] of Object.entries(zh2en)) if (z.includes(zh)) zhTerms.push(z);
    }
    const enTerms = en ? [en] : [...new Set(zhTerms.map(z => zh2en[z]).filter(Boolean))];
    const rows = DATA.products.filter(p =>
      enTerms.some(t => t && p.api && p.api.includes(t)) ||
      zhTerms.some(t => t && p.aizh && p.aizh.includes(t)));
    rows.sort((a, b) => (b.date || '').localeCompare(a.date || ''));
    return { term: en || (enTerms[0] || ''), zh, rows };
  }

  /* ---------- 厂家检索 ---------- */
  const normMfr = s => String(s || '').toLowerCase().replace(/[^a-z0-9\u4e00-\u9fff]+/g, '');
  function searchMfr(q) {
    const nq = normMfr(q);
    if (!nq) return { rows: [], apps: [] };
    const rows = DATA.products.filter(p => p.app && normMfr(p.app).includes(nq));
    rows.sort((a, b) => (b.date || '').localeCompare(a.date || ''));
    const cnt = new Map();
    for (const r of rows) {
      const k = r.app.trim();
      cnt.set(k, (cnt.get(k) || 0) + 1);
    }
    const apps = [...cnt.entries()].sort((a, b) => b[1] - a[1]);
    return { rows, apps };
  }

  /* ---------- 区域与规则 ---------- */
  const ASEAN = ['HSA','NPRA','BPOM','THAIFDA','DAV','PFDA','DFDA','DDF','FDD','BDMCA'];
  const FLAGS = { FDA:'🇺🇸', EU:'🇪🇺', MHRA:'🇬🇧', SWISSMEDIC:'🇨🇭', PMDA:'🇯🇵', NMPA:'🇨🇳',
    ROSZDRAV:'🇷🇺', CDSCO:'🇮🇳', HSA:'🇸🇬', NPRA:'🇲🇾', BPOM:'🇮🇩', THAIFDA:'🇹🇭', DAV:'🇻🇳', PFDA:'🇵🇭',
    DFDA:'🇲🇲', DDF:'🇰🇭', FDD:'🇱🇦', BDMCA:'🇧🇳' };
  const NODES = {
    FDA:        { x: 95,  y: 78,  t: '美国 FDA' },
    EU:         { x: 290, y: 58,  t: '欧盟' },
    MHRA:       { x: 290, y: 168, t: '英国 MHRA' },
    SWISSMEDIC: { x: 430, y: 112, t: '瑞士' },
    PMDA:       { x: 585, y: 58,  t: '日本 PMDA' },
    NMPA:       { x: 585, y: 225, t: '中国 NMPA' },
    ROSZDRAV:   { x: 95,  y: 225, t: '俄罗斯' },
    CDSCO:      { x: 205, y: 252, t: '印度 CDSCO' },
    ASEAN:      { x: 430, y: 240, t: '东盟十国' },
  };
  function regionOf(code) {
    if (ASEAN.includes(code)) return 'ASEAN';
    if (code === 'EU_MEMBER') return 'EU';
    return NODES[code] ? code : null;
  }
  function matchRules(approvedCodes) {
    const out = [];
    for (const r of DATA.rules) {
      const from = new Set(r.from.map(regionOf).filter(Boolean));
      if ([...from].some(n => approvedCodes.has(n))) out.push(r);
    }
    return out;
  }
  function codeLabel(code) {
    if (code === 'EAEU') return '欧亚经济联盟';
    if (code === 'TGA') return '澳大利亚 TGA';
    if (code === 'HEALTHCANADA') return '加拿大卫生部';
    if (code === 'EDQM') return '欧洲药典签署方';
    if (code === 'WHO_PQ') return 'WHO 预认证采信国';
    const reg = regionOf(code);
    if (reg && NODES[reg]) return NODES[reg].t;
    const a = DATA.authorities[code];
    return a ? a.country : code;
  }

  /* ---------- 渲染 ---------- */
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  function renderGroups(groups) {
    const box = $('#groups');
    box.innerHTML = '';
    const PAGE = 5;
    groups.forEach(([code, rows], gi) => {
      const a = DATA.authorities[code] || { country: code, authority: '' };
      const g = document.createElement('div');
      g.className = 'group';
      g.id = 'g-' + code;
      const recHtml = rows.map((r, i) => `
          <div class="rec${i >= PAGE ? ' hidden-rec' : ''}">
            <span class="pn">${esc(r.pn)}</span>
            ${r.url ? `<a href="${esc(r.url)}" target="_blank" rel="noopener">许可链接 ↗</a>` : '<span></span>'}
            <span class="sub2">${r.lic ? `批件号 <code class="mono">${esc(r.lic)}</code>` : ''}${r.date ? ` · 批准 ${esc(r.date)}` : ''}${r.app ? ` · ${esc(r.app)}` : ''}</span>
          </div>`).join('');
      g.innerHTML = `<header>
          <span class="flag">${FLAGS[code] || '🏳️'}</span>
          <div class="tt"><b>${esc(a.country)}</b><span>${esc(a.authority)}</span></div>
          <span class="cnt">${rows.length}</span>
        </header>` + recHtml +
        (rows.length > PAGE ? `<button class="expand-btn" type="button">展开全部 ${rows.length} 条 ▾</button>` : '');
      const btn = g.querySelector('.expand-btn');
      if (btn) btn.addEventListener('click', () => {
        const hidden = g.querySelectorAll('.rec.hidden-rec');
        if (hidden.length) {
          hidden.forEach(el => el.classList.remove('hidden-rec'));
          btn.textContent = '收起 ▴';
        } else {
          g.querySelectorAll('.rec').forEach((el, i) => { if (i >= PAGE) el.classList.add('hidden-rec'); });
          btn.textContent = `展开全部 ${rows.length} 条 ▾`;
          g.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
      });
      box.appendChild(g);
    });
  }

  function renderJuris(sorted) {
    const nav = $('#juris');
    nav.innerHTML = sorted.map(([c, rs]) =>
      `<button class="jchip" data-code="${esc(c)}" type="button">${FLAGS[c] || '🏳️'} ${esc(codeLabel(c))} <span class="n">${rs.length}</span></button>`
    ).join('');
    nav.hidden = false;
    nav.querySelectorAll('.jchip').forEach(b => b.addEventListener('click', () => {
      const el = document.getElementById('g-' + b.dataset.code);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }));
  }

  function renderMap(approvedRegions, usableRegions, edges) {
    const svg = $('#map');
    const W = 86, H = 34;
    let s = `<defs>
      <marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
        <path d="M0,0 L8,4 L0,8 z" fill="var(--kimi-color-accent, #2f6fed)"/></marker>
      <linearGradient id="ng" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="var(--kimi-color-accent, #2f6fed)"/><stop offset="1" stop-color="#7c5cff"/></linearGradient>
    </defs>`;
    const drawn = new Set();
    for (const e of edges) {
      const key = e.from + '>' + e.to;
      if (drawn.has(key) || e.from === e.to) continue;
      drawn.add(key);
      const a = NODES[e.from], b = NODES[e.to];
      if (!a || !b) continue;
      const x1 = a.x, y1 = a.y + H / 2, x2 = b.x, y2 = b.y + H / 2;
      const mx = (x1 + x2) / 2, my = (y1 + y2) / 2 - 16;
      s += `<path d="M${x1},${y1} Q${mx},${my} ${x2},${y2}" fill="none"
        stroke="var(--kimi-color-accent, #2f6fed)" stroke-width="1.4"
        stroke-dasharray="4 3" marker-end="url(#ar)" opacity="0.6"/>
        <text x="${mx}" y="${my + 3}" text-anchor="middle" font-size="9.5"
        fill="var(--kimi-color-text-tertiary, #6a737d)">${esc(e.label)}</text>`;
    }
    for (const [code, n] of Object.entries(NODES)) {
      const approved = approvedRegions.has(code);
      const usable = !approved && usableRegions.has(code);
      const fill = approved ? 'url(#ng)' : 'var(--kimi-color-surface-raised, #ffffff)';
      const stroke = approved ? 'none'
        : usable ? 'var(--kimi-color-accent, #2f6fed)' : 'var(--kimi-color-border, #d0d7de)';
      const dash = usable ? ' stroke-dasharray="5 3" stroke-width="1.8"' : '';
      const tc = approved ? '#fff' : 'var(--kimi-color-text-primary, #24292f)';
      s += `<rect x="${n.x - W / 2}" y="${n.y}" width="${W}" height="${H}" rx="10"
        fill="${fill}" stroke="${stroke}"${dash || ' stroke-width="1"'}/>
        <text x="${n.x}" y="${n.y + H / 2 + 4}" text-anchor="middle" font-size="11.5"
        font-weight="${approved ? 700 : 400}" fill="${tc}">${esc(n.t)}</text>`;
    }
    svg.innerHTML = s;
  }

  function renderHints(rules) {
    $('#hints').innerHTML = rules.map(r => `
      <div class="hint">
        <div class="h-t">${esc(r.id)} <span class="scope">· ${esc(r.scope)}</span></div>
        <div class="h-d">${esc(r.doc_type)}</div>
        <div class="h-u"><b>可使用于：</b>${r.usable_in.length ? r.usable_in.map(codeLabel).map(esc).join('；') : '（无自动互认目标，见说明）'}</div>
        <div class="h-d">${esc(r.note)}</div>
      </div>`).join('');
  }

  function run(q) {
    const headline = $('#headline'), meta = $('#headmeta');
    let rows, headlineText, metaText, emptyHint;
    if (mode === 'mfr') {
      const r = searchMfr(q);
      rows = r.rows;
      if (rows.length) {
        const gc = new Set(rows.map(x => x.c)).size;
        headlineText = `厂家「${q}」· 命中 ${r.apps.length} 个厂家主体 · ${gc} 个辖区 · 共 ${rows.length} 条`;
        metaText = r.apps.slice(0, 4).map(([a, n]) => `${a}（${n} 条）`).join('；') +
          (r.apps.length > 4 ? `；等共 ${r.apps.length} 个主体` : '');
      }
      emptyHint = `未检索到厂家「${q}」，可输入公司名关键词（中/英文均可），如：石药 / Teva / 正大天晴`;
    } else {
      const r = search(q);
      rows = r.rows;
      if (rows.length) {
        const gc = new Set(rows.map(x => x.c)).size;
        const disp = r.zh ? `${r.zh}${r.term && r.term !== r.zh ? ' / ' + r.term : ''}` : r.term;
        headlineText = `${disp} · 已在 ${gc} 个辖区获批 · 共 ${rows.length} 条`;
      }
      emptyHint = `未在数据库中检索到「${q}」，可尝试英文通用名或去掉剂型后缀`;
    }
    if (!rows.length) {
      headline.textContent = '未找到记录';
      meta.textContent = emptyHint;
      $('#results').hidden = true; $('#juris').hidden = true;
      return;
    }
    const groups = new Map();
    for (const r of rows) {
      if (!groups.has(r.c)) groups.set(r.c, []);
      groups.get(r.c).push(r);
    }
    const sorted = [...groups.entries()].sort((a, b) => b[1].length - a[1].length);
    headline.textContent = headlineText;
    meta.textContent = metaText || sorted.map(([c, rs]) => `${codeLabel(c)} ${rs.length}`).join(' ｜ ');

    renderJuris(sorted);
    renderGroups(sorted);

    const approvedRegions = new Set(sorted.map(([c]) => regionOf(c)).filter(Boolean));
    const rules = matchRules(approvedRegions);
    const usable = new Set(), edges = [];
    for (const r of rules) {
      const fromN = new Set(r.from.map(regionOf).filter(Boolean));
      const toN = new Set(r.usable_in.map(regionOf).filter(Boolean));
      for (const f of fromN) {
        if (!approvedRegions.has(f)) continue;
        for (const t of toN) {
          if (t !== f) { usable.add(t); edges.push({ from: f, to: t, label: r.id }); }
        }
      }
    }
    renderMap(approvedRegions, usable, edges.slice(0, 12));
    renderHints(rules);
    $('#results').hidden = false;
  }

  /* ---------- 初始化 ---------- */
  let mode = 'api';
  const EXAMPLES = {
    api: ['阿托伐他汀', '二甲双胍', 'atorvastatin', 'metformin', '布洛芬'],
    mfr: ['石药集团', 'Teva', '正大天晴', 'Epic Pharma', '华润'],
  };
  const PLACEHOLDERS = {
    api: '输入 API 中/英文名，如：阿托伐他汀 / atorvastatin',
    mfr: '输入厂家名称（中/英文），如：石药集团 / Teva',
  };
  const input = $('#q');
  function setMode(m) {
    mode = m;
    document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.mode === m));
    input.placeholder = PLACEHOLDERS[m];
    input.setAttribute('list', m === 'api' ? 'api-list' : 'mfr-list');
    const ex = $('#examples');
    ex.querySelectorAll('.chip').forEach(c => c.remove());
    for (const t of EXAMPLES[m]) {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'chip'; b.textContent = t;
      b.addEventListener('click', () => { input.value = t; run(t); });
      ex.appendChild(b);
    }
    $('#headline').innerHTML = '<span class="empty">' +
      (m === 'api' ? '输入一个仿制药 API，查看它在哪些国家已获批，以及相同技术证明文件还能在哪些国家使用。'
                   : '输入厂家名称，查看该厂家在哪些国家拥有已获批上市的仿制药。') + '</span>';
    $('#headmeta').textContent = '';
    $('#results').hidden = true; $('#juris').hidden = true;
  }
  document.querySelectorAll('.tab').forEach(b =>
    b.addEventListener('click', () => setMode(b.dataset.mode)));

  $('#f').addEventListener('submit', e => { e.preventDefault(); const v = input.value.trim(); if (v) run(v); });

  // 顶部统计
  const jurisCount = new Set(DATA.products.map(p => p.c)).size;
  $('#stats').innerHTML =
    `<span class="stat"><b>${DATA.products.length.toLocaleString()}</b>条许可记录</span>` +
    `<span class="stat"><b>${jurisCount}</b>个辖区</span>` +
    `<span class="stat">快照 <b>${String(DATA.generated_at).slice(0, 10)}</b></span>`;

  // 自动补全（API：中英文通用名；厂家：按记录数取高频厂家名）
  const names = new Set();
  for (const p of DATA.products) { if (p.api) names.add(p.api); if (p.aizh) names.add(p.aizh); }
  for (const [en, info] of Object.entries(DATA.aliases)) { names.add(en); if (info.zh) names.add(info.zh); }
  $('#api-list').innerHTML = [...names].sort().slice(0, 4000).map(n => `<option value="${esc(n)}">`).join('');
  const mfrCnt = new Map();
  for (const p of DATA.products) { if (p.app) { const k = p.app.trim(); mfrCnt.set(k, (mfrCnt.get(k) || 0) + 1); } }
  $('#mfr-list').innerHTML = [...mfrCnt.entries()].sort((a, b) => b[1] - a[1]).slice(0, 3000)
    .map(([n]) => `<option value="${esc(n)}">`).join('');

  setMode('api');

  $('#foot').innerHTML =
    `数据快照：${DATA.generated_at}（${DATA.products.length.toLocaleString()} 条）<br>` +
    `来源：美国 FDA Drugs@FDA · 欧盟 Union Register · 中国 NMPA/CDE 化学药品目录集 等官方站点<br>` +
    `本工具仅聚合各国监管机构公开数据，供研究参考，不构成注册申报或法律意见。`;

  $('#headline').innerHTML = '<span class="empty">输入一个仿制药 API，查看它在哪些国家已获批，以及相同技术证明文件还能在哪些国家使用。</span>';
})();
</script>
<script>
/* KimiPixelField（widgetdesign 资产内联）：空状态/头部的"全球流向"氛围场 */
(function (global) {
  'use strict';
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function seeded(seed) { let s = (Number(seed) || 1) >>> 0; return function () { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
  function densityAt(mode, x, y, config) {
    if (mode === 'directional') {
      const angle = (Number(config.flowAngleDeg) || 0) * Math.PI / 180;
      const dx = x - 0.5, dy = y - 0.5;
      const along = dx * Math.cos(angle) + dy * Math.sin(angle);
      const across = -dx * Math.sin(angle) + dy * Math.cos(angle);
      const lane = 1 - Math.abs(across) * 4.4;
      return clamp(lane * 0.72 + (along + 0.7) * 0.2, 0, 1);
    }
    return clamp(0.12 + x * 0.88, 0, 1);
  }
  function mount(container, options) {
    const config = Object.assign({ mode: 'directional', mark: 'ascii', seed: 7, spacing: 14, opacity: 0.4,
      pointer: true, pointerTarget: null, pointerRadius: 96, pointerStrength: 12, flowAngleDeg: 12,
      driftSpeed: 0, variance: 0.34, tier: 'regular', characters: '.:+*#' }, options || {});
    const pointerTarget = config.pointerTarget || container;
    const media = typeof global.matchMedia === 'function' ? global.matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };
    const reduced = config.tier === 'compact' || media.matches;
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    canvas.setAttribute('aria-hidden', 'true');
    Object.assign(canvas.style, { position: 'absolute', inset: '0', width: '100%', height: '100%', pointerEvents: 'none', zIndex: '0' });
    container.appendChild(canvas);
    let marks = [], pointer = null, frame = 0, destroyed = false;
    function dims() { const r = container.getBoundingClientRect(); return { w: Math.max(1, r.width), h: Math.max(1, r.height) }; }
    function rebuild() {
      const { w, h } = dims();
      const ratio = Math.min(global.devicePixelRatio || 1, 2);
      canvas.width = Math.round(w * ratio); canvas.height = Math.round(h * ratio);
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
      const gap = Math.max(8, config.spacing);
      const random = seeded(config.seed);
      const next = [];
      for (let y = gap / 2; y < h; y += gap) for (let x = gap / 2; x < w; x += gap) {
        const d = densityAt(config.mode, x / w, y / h, config);
        if (random() > d * 0.84) continue;
        next.push({ x: x + (random() - 0.5) * gap * config.variance, y: y + (random() - 0.5) * gap * config.variance, d });
      }
      marks = next; draw();
    }
    function draw() {
      if (destroyed) return;
      const { w, h } = dims();
      ctx.clearRect(0, 0, w, h);
      const color = global.getComputedStyle(container).color;
      ctx.fillStyle = color;
      for (const m of marks) {
        let x = m.x, y = m.y;
        if (pointer && !reduced) {
          const dx = x - pointer.x, dy = y - pointer.y;
          const dist = Math.sqrt(dx * dx + dy * dy) || 1;
          if (dist < config.pointerRadius) {
            const f = (1 - dist / config.pointerRadius) * config.pointerStrength;
            x += dx / dist * f; y += dy / dist * f;
          }
        }
        ctx.globalAlpha = clamp(config.opacity * (0.34 + m.d * 0.66), 0.04, 0.7);
        const chars = config.characters;
        ctx.font = `${Math.round(7 + m.d * 4)}px var(--kimi-font-mono, monospace)`;
        ctx.fillText(chars[Math.min(chars.length - 1, Math.floor(m.d * chars.length))], x, y);
      }
      ctx.globalAlpha = 1;
    }
    function requestDraw() { if (!frame) frame = requestAnimationFrame(() => { frame = 0; draw(); }); }
    pointerTarget.addEventListener('pointermove', e => {
      if (!config.pointer || reduced) return;
      const r = container.getBoundingClientRect();
      pointer = { x: e.clientX - r.left, y: e.clientY - r.top };
      requestDraw();
    }, { passive: true });
    pointerTarget.addEventListener('pointerleave', () => { pointer = null; draw(); }, { passive: true });
    if (global.ResizeObserver) new ResizeObserver(rebuild).observe(container);
    rebuild();
    return { destroy() { destroyed = true; if (frame) cancelAnimationFrame(frame); canvas.remove(); } };
  }
  global.KimiPixelField = { mount };
})(window);

KimiPixelField.mount(document.getElementById('pix'), {
  mode: 'directional', flowAngleDeg: 12, mark: 'ascii', characters: '.:+*#',
  pointer: true, pointerTarget: document.querySelector('.stage'), seed: 11,
});
</script>
</body>
